name: Build & publish

# Tests the game, exports a signed Android APK and a web build, then publishes
# both with a download page to the gh-pages branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv /tmp/tpl/templates/* "$dest/"

      - name: Put Godot on PATH
        run: |
          ln -sf ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run tests
        run: ./tests/run_all.sh

      - name: Configure Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
          else
            echo "::warning::No release keystore secret; signing with a throwaway key."
            KEYSTORE_PASSWORD=android; KEYSTORE_ALIAS=carom
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android -alias carom \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Carom"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          # Godot reads SDK/JDK paths (and needs a debug keystore) from editor settings.
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
          major_minor="${GODOT_VERSION%.*}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${major_minor}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.GODOT_RELEASE }}-${{ hashFiles('addons/**/*.gd') }}
          restore-keys: gradle-${{ env.GODOT_RELEASE }}-

      - name: Stamp version
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"1.0.${{ github.run_number }}\"/" export_presets.cfg

      - name: Export Android APK
        run: |
          mkdir -p build/android
          # Installs Godot's Gradle template, then the AdMob/Billing plugins patch it.
          godot --headless --path . --install-android-build-template --export-release "Android" build/android/carom.apk
          test -s build/android/carom.apk
          ls -lh build/android

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck

      - name: Assemble site
        run: |
          mkdir -p site/play
          cp -r build/web/* site/play/
          cp build/android/carom.apk site/carom.apk
          cp web/index.html site/index.html
          cp assets/icon.svg site/icon.svg
          size=$(du -h build/android/carom.apk | cut -f1)
          sed -i "s/{{APK_SIZE}}/${size}/; s/{{VERSION}}/1.0.${{ github.run_number }}/; s/{{BUILD_DATE}}/$(date -u +%Y-%m-%d)/" site/index.html
          touch site/.nojekyll

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" build/android/carom.apk \
            --title "Carom $tag" \
            --notes "Android build of ${GITHUB_SHA::7}. Install: download carom.apk on your phone and open it." \
            --latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carom-apk
          path: build/android/carom.apk

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true
          commit_message: "Publish build ${{ github.run_number }}"
