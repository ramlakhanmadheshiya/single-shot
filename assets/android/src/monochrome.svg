<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(512 512) scale(0.66) translate(-497 -535)">
  <!-- the wall the shot banks off -->
  <rect x="360" y="206" width="290" height="60" rx="30" fill="#FFFFFF"/>
  <!-- first leg: launcher up to the wall, dotted -->
  <g fill="#FFFFFF" ><circle cx="287" cy="705" r="13"/><circle cx="317" cy="645" r="13"/><circle cx="347" cy="585" r="13"/><circle cx="377" cy="525" r="13"/><circle cx="407" cy="465" r="13"/><circle cx="437" cy="405" r="13"/><circle cx="467" cy="345" r="13"/></g>
  <!-- the bounce: a small flash where the orb meets the wall -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
    <line x1="500" y1="292" x2="500" y2="330"/>
    <line x1="466" y1="296" x2="446" y2="322"/>
    <line x1="534" y1="296" x2="554" y2="322"/>
  </g>
  <!-- second leg (a true mirror bounce): a streak of light toward the target -->
  <path d="M 505 292 L 652 586" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" fill="none"/>
  <!-- target -->
    <circle cx="740" cy="760" r="104" fill="#FFFFFF"/>
  <circle cx="740" cy="760" r="46" fill="none" stroke="#000000" stroke-width="20"/>
  <!-- the orb, a moment before the hit -->
    <circle cx="660" cy="600" r="42" fill="#FFFFFF"/>
  <!-- launcher -->
  <circle cx="250" cy="780" r="60" fill="none" stroke="#FFFFFF" stroke-width="18"/>
  </g>
</svg>
